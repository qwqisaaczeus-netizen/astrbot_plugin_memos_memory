name: 问题报告
description: 报告可复现的问题，附版本、步骤和脱敏证据
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 README、安装说明和当前 Release 的已知边界。
        不要提交 Token、API key、私有配置、数据库、用户原文或未脱敏导出包；不必为反馈重跑收费模型。
  - type: input
    id: versions
    attributes:
      label: 版本
      description: 插件 / AstrBot / Memos 版本；升级问题请附起始版本
      placeholder: 插件 6.1.0 / AstrBot ... / Memos ... / 从 ... 升级
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 安装与升级
        - 兼容记忆生产
        - 6.1 新生产或草稿
        - 检索与注入
        - 模型调度或补偿
        - 心潮与小院
        - WebUI
        - 文档或其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用自行编写的合成样例即可；说明关键配置，不贴完整配置
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望与实际行为
      description: 生产问题请附模式、作业阶段、已用/上限调用次数、是否已写入 Memos
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图
      description: 可选。只保留说明问题所需的时间、阶段与错误类别；检查正文、地址、ID 和密钥
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除访问令牌、API key、私有配置和用户原文
          required: true
