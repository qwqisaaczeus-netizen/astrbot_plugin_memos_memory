<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型补偿 · Memos Memory</title>
<style>
:root{--bg:#edf1ef;--ink:#1d2924;--muted:#61716a;--line:#cfd9d3;--accent:#176c58;--accent-soft:#dcebe5;--danger:#a23939;--warn:#946018}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Microsoft YaHei",sans-serif;letter-spacing:0}.layout{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}aside{background:#182824;color:#dce8e3;padding:24px 18px}aside strong{display:block;font-size:21px;margin-bottom:25px}nav{display:grid;gap:5px}nav a{color:#cbdad4;text-decoration:none;padding:10px;border-radius:5px}nav a:hover,nav a.active{background:#28453d;color:#fff}main{width:min(1320px,100%);padding:30px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:27px;margin:0 0 5px}p{margin:0;color:var(--muted)}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:5px;padding:8px 11px;font:inherit;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.note{border-left:4px solid var(--accent);background:#fff;padding:13px 15px;margin:18px 0;color:#43554c}.table-scroll{overflow:auto;border:1px solid var(--line);background:#fff}.table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #e7eeea;vertical-align:top}th{background:#f7faf8;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}.meta{font-size:12px;color:var(--muted)}.error{max-width:300px;overflow-wrap:anywhere;color:var(--danger)}.actions{display:flex;gap:7px;white-space:nowrap}.badge{display:inline-block;padding:2px 7px;border-radius:4px;background:#edf3f0;color:#29634f}.badge.failed{background:#fae9e9;color:var(--danger)}.badge.running{background:#fff0d5;color:var(--warn)}.progress{width:220px;max-width:24vw}.progress-track{height:7px;margin:7px 0 5px;background:#dfe7e3;overflow:hidden}.progress-bar{height:100%;background:var(--accent);transition:width .35s ease}.stage{font-weight:600;color:#315247}.output{margin-top:7px}.output summary{cursor:pointer;color:var(--accent)}.output pre{max-width:360px;max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f5;border:1px solid var(--line);padding:9px}.empty{padding:40px;text-align:center;color:var(--muted)}#toast{position:fixed;right:20px;bottom:20px;max-width:500px;padding:12px 15px;background:#182824;color:white;display:none;white-space:pre-wrap;z-index:5}#result{margin-top:16px;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;border:1px solid var(--line);padding:14px;display:none;max-height:340px;overflow:auto}@media(max-width:800px){.layout{display:block}aside{padding:12px}aside strong{margin:0 0 8px}nav{display:flex;overflow:auto}main{padding:16px}header{align-items:flex-start;flex-direction:column}.progress{max-width:none}}
</style><link rel="stylesheet" href="/assets/workbench.css?v=610blue1"><link rel="stylesheet" href="/assets/atelier.css?v=610blue1"><script src="/assets/lucide.min.js" defer></script><script src="/assets/workbench.js?v=610blue1" defer></script></head><body><div class="layout"><aside><strong>模型补偿</strong><nav><a href="/">主 WebUI</a><a href="/models">模型调度</a><a class="active" href="/compensation">补偿</a><a href="/production">记忆生产</a><a href="/xinchao">心潮</a></nav></aside><main><header><div><h1>补偿与恢复</h1><p>双路失败请求持久保存在本地；后台任务离开此页面后仍会继续。</p></div><button onclick="load(false)">刷新</button></header><div class="note">记忆任务按完整原文批次重新取证和分篇，全部新日记通过文学性、证据与长度闸门后才原位替换。写回途中任一项失败会恢复已经替换的旧日记；同一批次只运行一个后台任务。</div><div id="table" class="table-scroll"><div class="empty">读取中…</div></div><pre id="result"></pre></main></div><div id="toast"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts){const r=await fetch(path,opts);const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));return j.data}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',6000)}
const statusName={pending:'待补偿',running:'后台处理中',restored:'已恢复',model_recovered:'已取回输出',failed:'可重试',dismissed:'已忽略'};
const stageName={queued:'等待开始',regenerating:'重新取证与生成',preparing:'创建回滚快照',committing:'原位写回',rolling_back:'恢复旧日记',completed:'已完成',failed:'执行失败',interrupted:'重载中断'};
let pollTimer=null;
function elapsed(ts){if(!ts)return '';const sec=Math.max(0,Math.floor(Date.now()/1000-Number(ts)));if(sec<60)return sec+' 秒';return Math.floor(sec/60)+' 分 '+sec%60+' 秒'}
function progressCell(x){const pct=Math.max(0,Math.min(100,Number(x.progress_percent||0)));if(x.status!=='running'&&!x.progress_stage)return '<span class="meta">尚未开始</span>';const output=x.result_preview?`<details class="output"><summary>查看恢复结果</summary><pre>${esc(x.result_preview)}</pre></details>`:'';return `<div class="progress"><div class="stage">${esc(stageName[x.progress_stage]||x.progress_stage||statusName[x.status]||x.status)}</div><div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div><div class="meta">${pct.toFixed(0)}%${x.progress_total?` · ${Number(x.progress_current||0)}/${Number(x.progress_total)}`:''}${x.status==='running'&&x.started_ts?` · ${elapsed(x.started_ts)}`:''}<br>${esc(x.progress_message||'')}</div>${output}</div>`}
function render(items){const running=items.some(x=>x.status==='running');document.getElementById('table').innerHTML=items.length?'<table class="table"><thead><tr><th>时间 / 请求</th><th>任务</th><th>状态</th><th>进度</th><th>最近错误</th><th>操作</th></tr></thead><tbody>'+items.map(x=>`<tr><td>${esc(new Date(Number(x.created_ts||0)*1000).toLocaleString())}<div class="meta">${esc(x.id)} · ${Number(x.attempts||0)} 次启动</div></td><td>${esc(x.label)}<div class="meta">${esc(x.source_batch_id||'无原文批次')}</div></td><td><span class="badge ${x.status==='failed'?'failed':x.status==='running'?'running':''}">${esc(statusName[x.status]||x.status)}</span></td><td>${progressCell(x)}</td><td class="error">Astr: ${esc(x.primary_error)}<br>API/最近: ${esc(x.fallback_error)}</td><td><div class="actions"><button class="primary" ${['running','restored','dismissed'].includes(x.status)?'disabled':''} onclick="restore('${esc(x.id)}')">${x.status==='running'?'处理中':'还原'}</button><button class="danger" ${['running','dismissed'].includes(x.status)?'disabled':''} onclick="dismiss('${esc(x.id)}')">忽略</button></div></td></tr>`).join('')+'</tbody></table>':'<div class="empty">没有待补偿的双路失败请求。</div>';clearTimeout(pollTimer);pollTimer=setTimeout(()=>load(true),running?1500:8000)}
async function load(silent=true){try{const d=await api('/api/compensation');render(d.items||[])}catch(e){clearTimeout(pollTimer);pollTimer=setTimeout(()=>load(true),8000);if(!silent)toast('加载失败：'+e.message)}}
async function restore(id){if(!confirm('启动后台补偿？记忆任务会先完整重建并验收，全部成功后才原位替换旧日记。'))return;toast('已提交后台补偿，可以离开此页面。');try{const d=await api('/api/compensation/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});const e=document.getElementById('result');e.style.display='block';e.textContent=JSON.stringify(d,null,2);await load(false)}catch(e){toast('启动失败：'+e.message);await load(false)}}
async function dismiss(id){if(!confirm('忽略此补偿单？不会删除原始聊天档案。'))return;try{await api('/api/compensation/dismiss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});await load(false)}catch(e){toast(e.message)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
load(false);
</script></body></html>
