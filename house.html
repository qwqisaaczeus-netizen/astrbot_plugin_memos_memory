function artifactHtml(x){const when=new Date(x.created_at).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});const send=x.sendable&&['sealed','archived'].includes(x.status)?`<button onclick="sendArtifact('${esc(x.id)}',${Number(x.revision||1)})">寄出</button>`:'';return `<article class="artifact" data-id="${esc(x.id)}"><h3>${esc(x.title||typeLabel[x.artifact_type]||'无题')}</h3><div class="artifact-meta"><span class="seal">${esc(typeLabel[x.artifact_type]||x.artifact_type)}</span><span>${esc(when)}</span><span>${esc(x.status||'sealed')}</span><span>${esc(x.reality_status==='internal'?'内心':'来源')}</span></div><p>${esc(x.content||'')}</p><div class="actions"><button onclick="markRead('${esc(x.id)}')">已读</button>${send}<button onclick="viewSources('${esc(x.id)}')">查看依据</button><button onclick="toggleFeedback('${esc(x.id)}')">反馈</button><button onclick="archiveArtifact('${esc(x.id)}')">封存</button>${app.zone==='chest'?`<button class="danger" onclick="deleteArtifact('${esc(x.id)}')">删除</button>`:''}</div><div id="fb-${esc(x.id)}" class="feedback">${feedbacks.map(f=>`<button onclick="feedback('${esc(x.id)}','${f[0]}')">${f[1]}</button>`).join('')}</div><div class="source">依据 ${Number((x.source_ids||[]).length)} 项 · ${esc(x.model_source||'unknown')}</div></article>`}
function dreamHtml(x){const when=x.created_at?new Date(x.created_at).toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'时间未记录';return `<article class="artifact"><h3>旧梦余痕</h3><div class="artifact-meta"><span class="seal">梦境历史</span><span>${esc(when)}</span><span>非现实</span></div><p>${esc(x.residue||x.awareness||'只留下模糊的余韵')}</p>${x.awareness?`<div class="source">醒后理解：${esc(x.awareness)}</div>`:''}</article>`}
function renderDrawer(){const items=matching(app.zone);document.getElementById('drawer-title').textContent=zoneTitle[app.zone];const tabs=document.getElementById('drawer-tabs');tabs.innerHTML=(zoneTypes[app.zone]||[]).map(k=>`<button class="active">${esc(typeLabel[k])}</button>`).join('')+(app.zone==='chest'?'<button class="active">全部历史</button>':'');let lead='';if(app.zone==='mailbox')lead='<div class="actions"><button class="primary" onclick="generateNow(\'unsent_note\')">写一封新笺</button></div>';if(app.zone==='study')lead='<div class="actions"><button class="primary" onclick="generateNow(\'letter\')">铺纸写信</button><button onclick="generateNow(\'reflection\')">静坐自省</button></div>';if(app.zone==='tea')lead='<div class="actions"><button class="primary" onclick="generateNow(\'unfinished_thread\')">续一盏茶</button></div>';if(app.zone==='bedroom')lead='<div class="notice">此处只呈现梦中或内心余韵；院落时段来自服务器真实当前时间。</div>';let content=items.map(artifactHtml).join('');if(app.zone==='bedroom')content+=app.dreams.map(dreamHtml).join('');document.getElementById('drawer-body').innerHTML=lead+(content||'<div class="empty">这里暂时没有留下文字</div>')}
function openZone(zone){app.zone=zone;document.querySelectorAll('.scene-nav button').forEach(b=>b.classList.toggle('active',b.dataset.zone===zone));renderDrawer();const d=document.getElementById('drawer');d.classList.add('open');d.setAttribute('aria-hidden','false')}
function closeDrawer(){const d=document.getElementById('drawer');d.classList.remove('open');d.setAttribute('aria-hidden','true')}
document.querySelectorAll('[data-zone]').forEach(el=>el.addEventListener('click',()=>openZone(el.dataset.zone)));
async function refresh(){await loadOverview();if(document.getElementById('drawer').classList.contains('open'))renderDrawer()}
async function generateNow(type){try{toast('院里正在落笔…');const d=await post('/api/house/generate/now',{artifact_type:type});toast(d.generated?'新的一页已经写好':'此刻没有合适的内容');await refresh()}catch(e){toast('生成失败：'+e.message)}}
async function markRead(id){try{await post('/api/house/artifact/read',{artifact_id:id});await refresh()}catch(e){toast(e.message)}}
function toggleFeedback(id){document.getElementById('fb-'+id)?.classList.toggle('open')}
async function viewSources(id){try{const d=await api('/api/house/artifact?id='+encodeURIComponent(id)),a=d.artifact||{},sources=d.sources||[];const ids=(a.source_ids||[]).map(x=>`<span class="seal">${esc(x)}</span>`).join(' ')||'没有外部事实来源';const rows=sources.map(x=>`<article class="artifact"><h3>${esc(x.source_name||'来源')}</h3><div class="artifact-meta"><span>${esc(x.captured_at||'')}</span></div><p>${esc(JSON.stringify(x.payload||{},null,2))}</p></article>`).join('');document.getElementById('sources-body').innerHTML='<div class="notice">这些依据只用于解释生成方向，小屋文字仍是角色内心产物，不是新增现实事件。</div><div class="source">'+ids+'</div>'+rows;document.getElementById('sources-modal').classList.add('open')}catch(e){toast(e.message)}}
function closeSources(){document.getElementById('sources-modal').classList.remove('open')}
async function feedback(id,type){try{await post('/api/house/artifact/feedback',{artifact_id:id,feedback_type:type});toast('反馈已留在小屋');document.getElementById('fb-'+id)?.classList.remove('open')}catch(e){toast(e.message)}}
async function archiveArtifact(id){try{await post('/api/house/artifact/archive',{artifact_id:id});toast('已收入木匣');await refresh()}catch(e){toast(e.message)}}
async function deleteArtifact(id){if(!confirm('只删除这条小屋内容？主记忆和梦境不会被删除。'))return;try{await post('/api/house/artifact/delete',{artifact_id:id});await refresh()}catch(e){toast(e.message)}}
async function sendArtifact(id,revision){if(!confirm('将这封信寄到当前小屋作用域最近验证的聊天会话？'))return;try{const key=crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random());await post('/api/house/artifact/send',{artifact_id:id,revision,idempotency_key:key,confirm:'SEND'});toast('信已经寄出');await refresh()}catch(e){toast('寄出失败：'+e.message)}}
function runReaction(name){const el=document.getElementById('character'),allowed=new Set(['nod','startle','lean','greet','soft','turn','still','sip','pour','tend','page','warm','listen','yawn']),reaction=allowed.has(name)?name:'nod',fallback={sip:'soft',pour:'turn',tend:'nod',page:'turn',warm:'soft',listen:'turn',yawn:'soft'}[reaction]||reaction;app.motionDirector.interruptForReaction();if(['sip','pour','tend','page','warm','listen','yawn'].includes(reaction)){app.characterRig?.play(reaction,1.08,1.7);app.live2d?.play(reaction)}else{app.characterRig?.react(reaction);app.live2d?.react(reaction)}clearTimeout(app.reactionTimer);el.classList.remove('is-reacting','reaction-nod','reaction-startle','reaction-lean','reaction-greet','reaction-soft','reaction-turn');if(reaction==='still'){app.motionDirector.resumeAfterReaction(8000);return}void el.offsetWidth;el.classList.add('is-reacting','reaction-'+fallback);app.reactionTimer=setTimeout(()=>{el.classList.remove('is-reacting','reaction-'+fallback);app.motionDirector.resumeAfterReaction(2400)},1750)}
function showCharacterSpeech(text){const s=document.getElementById('speech'),el=document.getElementById('character'),rect=el.getBoundingClientRect();s.textContent=text;s.style.left=Math.max(12,Math.min(innerWidth-s.offsetWidth-12,rect.left+rect.width*.52))+'px';s.style.top=Math.max(80,rect.top+rect.height*.18)+'px';s.classList.add('show');clearTimeout(app.speechTimer);app.speechTimer=setTimeout(()=>s.classList.remove('show'),2600)}
function applyManualCharacter(next,reaction,text){if(!app.overview)return;app.overview.character=next;placeCharacter(next);app.motionDirector.configure(next,app.overview.motion||{});runReaction(reaction);showCharacterSpeech(text)}
function schedulePreviewTour(delay=14000){if(!previewMode)return;clearTimeout(app.previewSceneTimer);app.previewSceneTimer=setTimeout(cyclePreviewScene,Math.max(4000,delay))}
function cyclePreviewScene(){if(!previewMode||!app.overview)return;app.previewSceneIndex=(app.previewSceneIndex+1)%previewScenes.length;const scene=previewScenes[app.previewSceneIndex],current=app.overview.character||{},el=document.getElementById('character'),next={...current,...scene,variant_id:'preview-scene-'+scene.sprite,position:{x:scene.x,y:scene.y,scale:scene.scale}};app.manualExpressionIndex=-1;el.style.opacity='.08';setTimeout(()=>{applyManualCharacter(next,scene.reaction_animation,'她换了一处地方，继续做着手边的事。');requestAnimationFrame(()=>{el.style.opacity=''});schedulePreviewTour(14000)},240)}
function cycleCharacterExpression(){const current=app.overview?.character||{},details=characterDetails[current.sprite]||characterDetails.default;if(app.manualExpressionIndex<0)app.manualExpressionIndex=Math.max(0,details.findIndex(item=>item.expression===current.expression));app.manualExpressionIndex=(app.manualExpressionIndex+1)%details.length;const detail=details[app.manualExpressionIndex];current.expression=detail.expression;document.getElementById('character').dataset.expression=detail.expression;document.getElementById('character').title=(current.pose||'')+' · '+detail.expression;app.characterRig?.setExpression(detail.expression);app.characterRig?.forceBlink(380);app.live2d?.setExpression(detail.expression);app.live2d?.forceBlink(380);runReaction(detail.action);showCharacterSpeech(detail.text);schedulePreviewTour(18000)}
function cycleCharacterPosition(){const current=app.overview?.character||{};if(app.manualPositionIndex<0)app.manualPositionIndex=Math.max(0,manualPositions.findIndex(item=>item.sprite===current.sprite&&item.location===current.location));app.manualPositionIndex=(app.manualPositionIndex+1)%manualPositions.length;const target=manualPositions[app.manualPositionIndex],next={...current,...target,variant_id:'manual-position-'+target.sprite,placement_variant:target.id,position:{x:target.x,y:target.y,scale:target.scale}};app.manualExpressionIndex=-1;applyManualCharacter(next,'turn','她沿着院中小径，换到'+target.label+'继续手边的事。');schedulePreviewTour(18000)}
function handleCharacterContext(e){e.preventDefault();e.stopPropagation();const now=performance.now(),doubleWindow=360;if(app.rightClickTimer&&now-app.lastRightClickAt<=doubleWindow){clearTimeout(app.rightClickTimer);app.rightClickTimer=null;app.lastRightClickAt=0;cycleCharacterPosition();return}clearTimeout(app.rightClickTimer);app.lastRightClickAt=now;app.rightClickTimer=setTimeout(()=>{app.rightClickTimer=null;app.lastRightClickAt=0;cycleCharacterExpression()},doubleWindow)}
async function interactCharacter(){try{const c=app.overview?.character||{},s=document.getElementById('speech'),el=document.getElementById('character');let reactionText='',reactionName='';if(previewMode){reactionName=cssToken(c.reaction_animation||'greet','greet');reactionText='我在。风吹过来时，衣袖也会跟着动。'}else{const d=await post('/api/house/character/interact',{scope:app.overview?.scope_key||'',action:'tap',variant_id:c.variant_id,pose:c.pose,expression:c.expression,outfit:c.outfit,location:c.location});reactionName=cssToken(d.extension?.suggested_animation||c.reaction_animation||'nod','nod');reactionText=d.reaction.text}runReaction(reactionName);const rect=el.getBoundingClientRect();s.textContent=reactionText;s.style.left=Math.max(12,Math.min(innerWidth-s.offsetWidth-12,rect.left+rect.width*.52))+'px';s.style.top=Math.max(80,rect.top+rect.height*.18)+'px';s.classList.add('show');clearTimeout(app.speechTimer);app.speechTimer=setTimeout(()=>s.classList.remove('show'),3600)}catch(e){toast(e.message)}}
document.getElementById('character').addEventListener('click',interactCharacter);
document.getElementById('character').addEventListener('contextmenu',handleCharacterContext);
async function openSettings(){document.getElementById('settings-modal').classList.add('open');try{const s=await api('/api/house/settings');app.settings=s;document.getElementById('s-enable').checked=!!s.house_enable;document.getElementById('s-link').checked=!!s.house_natural_link_enable;document.getElementById('s-url').value=s.house_api_base_url||'';document.getElementById('s-model').value=s.house_model||'';document.getElementById('s-key').value='';document.getElementById('s-key').placeholder=s.has_api_key?'已保存，留空保持不变':'输入独立 API Key';document.getElementById('s-idle').value=s.house_idle_start_hours;document.getElementById('s-day').value=s.house_artifact_max_per_day;document.getElementById('s-session').value=s.house_artifact_max_per_session;document.getElementById('s-cooldown').value=s.house_type_cooldown_hours;document.getElementById('s-source-cooldown').value=s.house_memory_source_cooldown_days;document.getElementById('s-expire').value=s.house_afterglow_expire_hours;document.getElementById('s-send-cooldown').value=s.house_send_cooldown_hours;document.getElementById('s-timeout').value=s.house_timeout_seconds;document.getElementById('s-max-tokens').value=s.house_max_output_tokens;document.getElementById('s-retries').value=s.house_max_retries;document.getElementById('s-temp').value=s.house_temperature;document.getElementById('s-motion').checked=s.house_motion_enable!==false;document.getElementById('s-motion-intensity').value=s.house_motion_intensity||'balanced';document.getElementById('s-character-render').value=s.house_character_render_mode||'hybrid';document.getElementById('s-ambient').checked=s.house_ambient_enable!==false;document.getElementById('s-parallax').checked=s.house_parallax_enable!==false;document.getElementById('s-dream').checked=!!s.house_dream_link_enable;document.getElementById('s-send').checked=!!s.house_send_enable;document.getElementById('s-clear-key').checked=false}catch(e){toast(e.message)}}
function closeSettings(){document.getElementById('settings-modal').classList.remove('open')}
function settingsBody(){return{house_enable:document.getElementById('s-enable').checked,house_natural_link_enable:document.getElementById('s-link').checked,house_api_base_url:document.getElementById('s-url').value.trim(),house_model:document.getElementById('s-model').value.trim(),house_api_key:document.getElementById('s-key').value.trim(),clear_api_key:document.getElementById('s-clear-key').checked,house_idle_start_hours:Number(document.getElementById('s-idle').value),house_artifact_max_per_day:Number(document.getElementById('s-day').value),house_artifact_max_per_session:Number(document.getElementById('s-session').value),house_type_cooldown_hours:Number(document.getElementById('s-cooldown').value),house_memory_source_cooldown_days:Number(document.getElementById('s-source-cooldown').value),house_afterglow_expire_hours:Number(document.getElementById('s-expire').value),house_send_cooldown_hours:Number(document.getElementById('s-send-cooldown').value),house_timeout_seconds:Number(document.getElementById('s-timeout').value),house_max_output_tokens:Number(document.getElementById('s-max-tokens').value),house_max_retries:Number(document.getElementById('s-retries').value),house_temperature:Number(document.getElementById('s-temp').value),house_motion_enable:document.getElementById('s-motion').checked,house_motion_intensity:document.getElementById('s-motion-intensity').value,house_character_render_mode:document.getElementById('s-character-render').value,house_ambient_enable:document.getElementById('s-ambient').checked,house_parallax_enable:document.getElementById('s-parallax').checked,house_dream_link_enable:document.getElementById('s-dream').checked,house_send_enable:document.getElementById('s-send').checked}}
async function saveSettings(){try{await post('/api/house/settings/save',{settings:settingsBody()});toast('小屋设置已保存');closeSettings();await refresh()}catch(e){toast('保存失败：'+e.message)}}
async function testConnection(){try{await post('/api/house/settings/save',{settings:settingsBody()});const d=await post('/api/house/settings/test',{});toast(d.ok?'独立模型连接正常':'连接未通过：'+(d.reason||'请检查设置'))}catch(e){toast('连接失败：'+e.message)}}
document.getElementById('settings-modal').addEventListener('click',e=>{if(e.target.id==='settings-modal')closeSettings()});document.getElementById('sources-modal').addEventListener('click',e=>{if(e.target.id==='sources-modal')closeSources()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeSettings();closeSources()}});app.backgroundDirector=new BackgroundDirector();const initialPeriod=localPeriod(),previewParams=new URLSearchParams(location.search),previewMode=previewParams.has('preview');document.getElementById('scene').className='scene '+initialPeriod+' motion-balanced';app.backgroundDirector.configure(initialPeriod);app.motionGarden=new MotionGarden();app.characterRig=new HouseCharacterRig(document.getElementById('character-rig'),document.getElementById('character'));app.live2d=new HouseLive2D(document.getElementById('character-live2d'),document.getElementById('character'));app.motionDirector=new CharacterMotionDirector();if(previewMode){applyOverview(previewOverview());if(previewParams.get('tour')!=='0')schedulePreviewTour(4500)}else{app.characterRig.configure({atlas:'a',sprite:'fan'},{enabled:true,intensity:'balanced',character_render_mode:'hybrid'});app.live2d.configure({atlas:'a',sprite:'fan',expression:'gentle'},{enabled:true,intensity:'balanced',character_render_mode:'hybrid'});loadOverview()}window.__houseRigDebug=()=>({...app.characterRig.debug(),live2d:app.live2d.debug(),backgroundPeriod:document.getElementById('scene').dataset.backgroundPeriod||'',scenePeriod:[...document.getElementById('scene').classList].find(x=>courtyardBackgrounds[x])||''});window.__houseRigDebugControl={blink:(duration=520)=>{app.characterRig.forceBlink(duration);app.live2d.forceBlink(duration)},expression:value=>{app.characterRig.setExpression(value);app.live2d.setExpression(value)},detail:()=>cycleCharacterExpression(),move:()=>cycleCharacterPosition(),scene:()=>({...app.overview?.character}),stopTour:()=>clearTimeout(app.previewSceneTimer)};addEventListener('pagehide',()=>{clearTimeout(app.previewSceneTimer);app.live2d?.destroy()});setInterval(renderClock,30000);
</script>
