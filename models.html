<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>调度中心 · Memos Memory</title>
<link rel="stylesheet" href="/assets/workbench.css?v=610blue1"><link rel="stylesheet" href="/assets/atelier.css?v=610blue1">
<script src="/assets/lucide.min.js" defer></script><script src="/assets/workbench.js?v=610blue1" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}.shell{min-height:100vh}.top{display:flex;justify-content:space-between;gap:20px;align-items:start}.top h1{margin:0}.top p{color:var(--muted);margin:8px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 14px;cursor:pointer}.btn.primary{color:white}.btn.danger{color:var(--red)}.summary{display:grid;grid-template-columns:repeat(4,1fr)}.metric small{display:block;color:var(--muted)}.metric b{display:block;font-weight:600}.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end}.field{display:grid;gap:7px}.field small,.health{color:var(--muted);font-size:12px}.switch{display:flex;align-items:center;gap:10px}.switch small{display:block;color:var(--muted);font-size:12px}.field input,.field select{width:100%}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.model-foot{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line2);margin-top:20px;padding-top:16px}.badge{font-size:11px;background:var(--surface2);padding:3px 8px;border-radius:4px}.badge.ok{background:var(--green2);color:var(--green)}.badge.bad{color:var(--red)}.calls-scroll{overflow:auto;border:1px solid var(--line);border-radius:6px}table{border-collapse:collapse;width:100%;min-width:740px}th,td{text-align:left;border-bottom:1px solid var(--line2);font-size:12px}.failed{color:var(--red)}.succeeded{color:var(--green)}.toast{display:none;position:fixed;bottom:24px;right:24px;padding:14px 20px;max-width:min(480px,90vw);background:#242b31;color:white;border-radius:6px;z-index:90}.toast.bad{background:#873b49}.empty{text-align:center;color:var(--muted)}.muted{color:var(--muted);font-size:12px}.task-search{width:100%;max-width:480px}.scope-save{display:flex;justify-content:flex-end;padding:18px 0}.section-error{color:var(--red);padding:14px 0}
</style></head><body><div class="shell"><main class="main">
<header class="top"><div><h1>调度中心</h1><p>模型分工、备用路线与调用状态</p></div><div class="actions"><button class="btn" onclick="reloadCenter()" title="刷新调度数据"><i data-lucide="refresh-cw"></i></button><a class="btn" href="/compensation">补偿与恢复</a></div></header>
<section class="summary"><div class="metric"><small>默认路线</small><b id="m-enabled">—</b></div><div class="metric"><small>外置模型</small><b id="m-total">0</b></div><div class="metric"><small>配置就绪</small><b id="m-ready">0</b></div><div class="metric"><small>模型池切换</small><b id="m-fallback">—</b></div></section>
<nav class="wb-tabs" aria-label="调度分区">
<button data-pane="tasks" aria-selected="true">任务分工</button><button data-pane="fallback">跟接策略</button><button data-pane="pool">外置模型</button><button data-pane="independent">独立通道</button><button data-pane="calls">调用记录</button>
</nav>
<section class="wb-pane" id="pane-tasks"><div class="wb-section-head"><div><h2>任务模型与运行参数</h2><p id="task-notice">读取设置中</p></div><button class="btn primary" onclick="saveTaskSettings()">保存任务设置</button></div><input class="task-search" id="task-search" type="search" placeholder="查找任务、模型或参数" aria-label="查找任务设置"><div id="task-settings"></div><div id="mind-tasks"></div></section>
<section class="wb-pane" id="pane-fallback" hidden><div class="wb-section-head"><div><h2>Astr 故障跟接</h2><p>任务专属路线优先于类别默认，未指定时沿用已有设置</p></div><button class="btn primary" onclick="save()">保存跟接策略</button></div>
<section class="settings"><label class="switch"><input id="followup-enabled" type="checkbox"><span><b>启用跟接</b></span></label><div class="field"><label for="followup-model">类别默认模型</label><select id="followup-model"></select></div><div class="field"><label for="followup-timeout">兼容链路跟接超时（秒）</label><input id="followup-timeout" type="number" min="10" max="300"></div></section>
<details class="wb-fold"><summary>类别默认范围</summary><div id="followup-tasks" style="display:flex;flex-wrap:wrap;gap:18px;padding:16px 0"></div></details><div id="route-settings"></div><p class="muted">6.1 新生产的备用调用遵守其冻结任务超时和总预算。修改路线不重置在途作业。</p></section>
<section class="wb-pane" id="pane-pool" hidden><div class="wb-section-head"><div><h2>外置模型池</h2><p id="notice">主回复模型、Embedding 与 rerank 不由模型池接管。</p></div><div class="actions"><button class="btn" onclick="addModel()">新增模型</button><button class="btn primary" onclick="save()">保存模型池</button></div></div>
<section class="settings"><label class="switch"><input id="pool-enabled" type="checkbox"><span><b>启用模型池接管</b><small>仅影响插件内部聊天模型</small></span></label><label class="switch"><input id="fallback-enabled" type="checkbox"><span><b>允许模型池故障切换</b></span></label><div class="field"><label for="default-model">默认模型</label><select id="default-model"></select></div></section>
<div id="models" class="model-list"></div></section>
<section class="wb-pane" id="pane-independent" hidden><div class="wb-section-head"><div><h2>独立通道</h2><p>保留心潮与小院各自的 API 及密钥，不与全局接管混用。</p></div></div><div id="mind-api"></div><div id="house-api"></div></section>
<section class="wb-pane" id="pane-calls" hidden><div class="wb-section-head"><h2>调用与回退</h2><button class="btn" onclick="loadCalls()">刷新记录</button></div><div class="calls-scroll" id="calls"></div><div class="wb-section-head"><h2>6.1 生产调度</h2><a href="/production">进入生产工作台</a></div><div id="v2-calls"></div></section>
<span id="version" hidden></span></main></div><div id="toast" class="toast" role="status"></div>
<script>
let state={enabled:false,fallback_enabled:true,default_model_id:'',models:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,opts){const r=await fetch(path,opts);const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));return j.data}
function toast(text,bad=false){const e=document.getElementById('toast');e.textContent=text;e.className='toast'+(bad?' bad':'');e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4200)}
function id(){return 'model_'+crypto.getRandomValues(new Uint32Array(2)).join('').slice(0,12)}
function addModel(){state.models.push({id:id(),name:'',base_url:'',model:'',enabled:true,priority:50,max_retries:0,timeout_seconds:60,temperature:.1,max_output_tokens:16384,api_key:'',has_api_key:false});render()}
function removeModel(mid){if(!confirm('删除该模型配置？已保存的密钥也会删除。'))return;state.models=state.models.filter(x=>x.id!==mid);if(state.default_model_id===mid)state.default_model_id='';render()}
function setv(mid,key,value){const x=state.models.find(x=>x.id===mid);if(x)x[key]=value;renderSummary()}
function toggleModel(mid,enabled){const x=state.models.find(x=>x.id===mid);if(x)x.enabled=enabled;if(!state.models.some(x=>x.enabled&&x.id===state.default_model_id))state.default_model_id=(state.models.find(x=>x.enabled)||{}).id||'';render()}
function health(x){const h=x.health||{};if(h.last_success_at)return `<span class="badge ok">可用</span> 最近 ${Number(h.last_latency_ms||0)} ms · 成功 ${Number(h.successes||0)} 次`;if(h.last_failure_at)return `<span class="badge bad">异常</span> ${esc(h.last_error||'调用失败')}`;return `<span class="badge">未测试</span>`}
function modelHtml(x,i){const keyHint=x.has_api_key?'密钥已保存，留空保持不变':'输入 API Key';return `<article class="model"><div class="model-head"><div class="model-title"><strong>${esc(x.name||x.model||('模型 '+(i+1)))}</strong>${x.id===state.default_model_id?'<span class="badge ok">默认</span>':''}</div><label class="switch"><input type="checkbox" ${x.enabled?'checked':''} onchange="toggleModel('${x.id}',this.checked)"><span>启用</span></label></div><div class="grid"><div class="field"><label>显示名称</label><input value="${esc(x.name||'')}" oninput="setv('${x.id}','name',this.value)"></div><div class="field"><label>API Base URL</label><input value="${esc(x.base_url||'')}" placeholder="https://api.example.com/v1" oninput="setv('${x.id}','base_url',this.value)"></div><div class="field"><label>model</label><input value="${esc(x.model||'')}" placeholder="model-name" oninput="setv('${x.id}','model',this.value)"></div><div class="field"><label>优先级</label><input type="number" min="0" max="999" value="${Number(x.priority??50)}" oninput="setv('${x.id}','priority',Number(this.value))"></div><div class="field"><label>单模型超时</label><input type="number" min="3" max="600" value="${Number(x.timeout_seconds||60)}" oninput="setv('${x.id}','timeout_seconds',Number(this.value))"></div><div class="field"><label>温度</label><input type="number" min="0" max="2" step=".1" value="${Number(x.temperature??.1)}" oninput="setv('${x.id}','temperature',Number(this.value))"></div></div><div class="grid" style="grid-template-columns:1.5fr .55fr .55fr .55fr"><div class="field"><label>API Key</label><input type="password" value="" placeholder="${esc(keyHint)}" autocomplete="new-password" oninput="setv('${x.id}','api_key',this.value)"></div><div class="field"><label>输出上限</label><input type="number" min="256" max="32768" step="256" value="${Number(x.max_output_tokens||8192)}" oninput="setv('${x.id}','max_output_tokens',Number(this.value))"></div><div class="field"><label>内部重试</label><input type="number" min="0" max="1" value="${Number(x.max_retries||0)}" oninput="setv('${x.id}','max_retries',Number(this.value))"></div><label class="switch" style="align-self:end;padding-bottom:8px"><input type="checkbox" onchange="setv('${x.id}','clear_api_key',this.checked)"><span>清除密钥</span></label></div><div class="model-foot"><div class="health">${health(x)}</div><div class="actions"><button class="btn" onclick="testModel('${x.id}')">测试</button><button class="btn danger" onclick="removeModel('${x.id}')">删除</button></div></div></article>`}
function renderSummary(){document.getElementById('m-enabled').textContent=document.getElementById('pool-enabled').checked?'外置':'Astr';document.getElementById('m-total').textContent=state.models.length;document.getElementById('m-ready').textContent=state.models.filter(x=>x.enabled&&(x.has_api_key||x.api_key)).length;document.getElementById('m-fallback').textContent=document.getElementById('fallback-enabled').checked?'开启':'关闭'}
function render(){document.getElementById('pool-enabled').checked=!!state.enabled;document.getElementById('fallback-enabled').checked=state.fallback_enabled!==false;document.getElementById('followup-enabled').checked=!!state.astr_followup_enabled;document.getElementById('followup-timeout').value=Number(state.astr_followup_timeout||90);document.getElementById('models').innerHTML=state.models.length?state.models.map(modelHtml).join(''):'<div class="empty">还没有外置模型。新增后填写 OpenAI 兼容地址、model 与 API Key。</div>';const active=state.models.filter(x=>x.enabled),sel=document.getElementById('default-model'),follow=document.getElementById('followup-model');const options=active.length?active.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.model||x.id)}</option>`).join(''):'<option value="">暂无可用模型</option>';sel.innerHTML=options;follow.innerHTML=options;sel.value=state.default_model_id||'';follow.value=state.astr_followup_model_id||'';document.getElementById('followup-tasks').innerHTML=(state.followup_task_options||[]).map(x=>`<label class="switch"><input type="checkbox" value="${esc(x.value)}" ${(state.astr_followup_tasks||[]).includes(x.value)?'checked':''}><span>${esc(x.label)}</span></label>`).join('');renderSummary()}
async function load(){try{state=await request('/api/models');document.getElementById('version').textContent='Memos Memory '+(state.plugin_version||'');document.getElementById('notice').textContent=state.notice||document.getElementById('notice').textContent;render();await loadCalls()}catch(e){toast('加载失败：'+e.message,true)}}
async function save(){state.enabled=document.getElementById('pool-enabled').checked;state.fallback_enabled=document.getElementById('fallback-enabled').checked;state.default_model_id=document.getElementById('default-model').value;state.astr_followup_enabled=document.getElementById('followup-enabled').checked;state.astr_followup_model_id=document.getElementById('followup-model').value;state.astr_followup_timeout=Number(document.getElementById('followup-timeout').value||90);state.astr_followup_tasks=[...document.querySelectorAll('#followup-tasks input:checked')].map(x=>x.value);try{const taskOptions=state.followup_task_options;state=await request('/api/models/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:state.enabled,fallback_enabled:state.fallback_enabled,default_model_id:state.default_model_id,astr_followup_enabled:state.astr_followup_enabled,astr_followup_model_id:state.astr_followup_model_id,astr_followup_timeout:state.astr_followup_timeout,astr_followup_tasks:state.astr_followup_tasks,models:state.models})});state.followup_task_options=taskOptions;render();toast(state.persisted?'模型调度设置已持久化并立即应用':'设置已应用，但持久化状态未确认',!state.persisted)}catch(e){toast('保存失败：'+e.message,true)}}
async function testModel(mid){toast('正在测试模型...');try{const d=await request('/api/models/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model_id:mid,timeout:20})});toast(`${d.name||mid} 可用，${d.latency_ms||0} ms`);await load()}catch(e){toast('测试失败：'+e.message,true);await load()}}
async function loadCalls(){try{const data=await request('/api/models/calls');const rows=(data.calls||[]).slice(-60).reverse();document.getElementById('calls').innerHTML=rows.length?'<table><thead><tr><th>时间</th><th>任务</th><th>模型路线</th><th>结果</th><th>排队</th><th>模型耗时</th><th>总耗时</th><th>故障序位</th></tr></thead><tbody>'+rows.map(x=>{const ok=x.outcome==='success';return `<tr><td>${esc(new Date(Number(x.ts||0)*1000).toLocaleString())}</td><td>${esc(x.task||'')}</td><td>${esc(x.provider||'')}</td><td class="${ok?'succeeded':'failed'}">${esc(x.outcome||'')}</td><td>${Number(x.queue_wait_ms||0).toFixed(0)} ms</td><td>${Number(x.provider_ms||0).toFixed(0)} ms</td><td>${Number(x.total_ms||x.provider_ms||0).toFixed(0)} ms</td><td>${x.fallback_index==null?'—':Number(x.fallback_index)+1}</td></tr>`}).join('')+'</tbody></table>':'<div class="empty">还没有插件模型调用样本。</div>'}catch(e){document.getElementById('calls').textContent='记录读取失败：'+e.message}}
document.getElementById('pool-enabled').addEventListener('change',renderSummary);document.getElementById('fallback-enabled').addEventListener('change',renderSummary);document.getElementById('default-model').addEventListener('change',e=>state.default_model_id=e.target.value);
</script>
<script src="/assets/scheduling.js?v=610blue1"></script>
</body></html>
